<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rekap Berita — Pemkab Aceh Barat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --ink:#1C2333;
  --ink-soft:#2A3350;
  --paper:#F6F3EC;
  --card:#FFFFFF;
  --line:#DDD6C4;
  --text:#262420;
  --text-muted:#79735F;
  --accent:#B8792F;
  --accent-dark:#8F5D22;
  --accent-soft:#F1E2C6;
  --success:#3F7853;
  --success-soft:#DCEAE0;
  --danger:#B4483A;
  --danger-soft:#F3DCD8;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif;
  background:var(--paper);
  color:var(--text);
  min-height:100vh;
}
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh;}
.loading-screen{padding:60px;font-family:'Source Serif 4',serif;font-size:18px;color:var(--text-muted);}

/* Sidebar */
.sidebar{background:var(--ink);color:#EDE8DA;padding:28px 20px;display:flex;flex-direction:column;}
.nameplate{margin-bottom:28px;}
.nameplate .kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#9CA6C4;margin-bottom:4px;}
.nameplate h1{font-family:'Source Serif 4',serif;font-size:30px;line-height:1.05;margin:0 0 6px;font-weight:700;}
.nameplate .sub{font-size:12px;color:#B9B2A0;}
.rule-double{border-top:2px solid #46507A;border-bottom:1px solid #46507A;height:3px;margin:14px 0 20px;}
nav{display:flex;flex-direction:column;gap:4px;flex:1;}
nav button{
  background:none;border:none;text-align:left;color:#CDC7B4;
  font-family:'Inter',sans-serif;font-size:14.5px;font-weight:500;
  padding:11px 12px;border-radius:6px;cursor:pointer;transition:.15s;
}
nav button:hover{background:#2A3350;color:#fff;}
nav button.active{background:var(--accent);color:#fff;font-weight:600;}
.sidebar-footer{margin-top:auto;padding-top:16px;border-top:1px solid #3A4266;}
.sidebar-footer .status{font-size:11px;color:#8F8973;margin-bottom:10px;}
.reset-btn{background:none;border:1px solid #4A5378;color:#A9A28E;font-size:11.5px;padding:7px 10px;border-radius:5px;cursor:pointer;width:100%;}
.reset-btn:hover{border-color:var(--danger);color:#E4A499;}

/* Main */
main{padding:36px 44px;overflow-x:auto;}
.topbar{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:8px;}
.masthead .kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);margin-bottom:2px;}
.masthead h2{font-family:'Source Serif 4',serif;font-size:32px;margin:0;font-weight:700;color:var(--ink);}
.masthead-rule{border-top:2.5px solid var(--ink);border-bottom:1px solid var(--line);height:5px;margin:10px 0 26px;}
.export-btn{
  background:var(--accent);color:#fff;border:none;padding:11px 18px;border-radius:6px;
  font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;
}
.export-btn:hover{background:var(--accent-dark);}

.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:24px;margin-bottom:24px;}
.card h3{font-family:'Source Serif 4',serif;font-size:19px;margin:0 0 16px;color:var(--ink);}
.empty-note{background:var(--accent-soft);border:1px solid #E3CFA2;border-radius:8px;padding:16px 18px;color:#6B4E1C;font-size:14px;}
.empty-note button{margin-top:10px;background:var(--ink);color:#fff;border:none;padding:8px 14px;border-radius:5px;font-size:13px;cursor:pointer;}

form.inline-form{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.03em;}
.field input,.field select{
  font-family:'Inter',sans-serif;font-size:14px;padding:9px 11px;border:1px solid var(--line);
  border-radius:6px;background:#FCFBF8;min-width:170px;color:var(--text);
}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent);}
.field.grow{flex:1;min-width:220px;}
.btn-primary{background:var(--ink);color:#fff;border:none;padding:10px 18px;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;}
.btn-primary:hover{background:var(--ink-soft);}
.btn-small{border:none;background:none;font-size:12.5px;font-weight:600;cursor:pointer;padding:4px 8px;border-radius:4px;}
.btn-edit{color:var(--accent-dark);}
.btn-edit:hover{background:var(--accent-soft);}
.btn-del{color:var(--danger);}
.btn-del:hover{background:var(--danger-soft);}
.btn-save{color:var(--success);}
.btn-cancel{color:var(--text-muted);}

table{width:100%;border-collapse:collapse;font-size:14px;}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);padding:8px 10px;border-bottom:2px solid var(--ink);font-weight:600;}
td{padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
tr:last-child td{border-bottom:none;}
.muted{color:var(--text-muted);font-size:13px;}
.mono{font-family:'IBM Plex Mono',monospace;}
.actions-cell{white-space:nowrap;}
.edit-input{font-size:13.5px;padding:6px 8px;border:1px solid var(--line);border-radius:5px;width:100%;}

.rank-badge{
  display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;
  border-radius:50%;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px;
  background:#EFEBE0;color:var(--text-muted);
}
.rank-1{background:var(--accent);color:#fff;}
.rank-2{background:#CBB98F;color:#3E2E10;}
.rank-3{background:#E3D6B6;color:#5C441A;}
.row-top .media-cell{font-weight:600;}

.checklist-toolbar{display:flex;gap:14px;margin-bottom:10px;}
.checklist-toolbar button{padding:5px 4px;}
.media-checklist{display:flex;flex-wrap:wrap;gap:8px;padding:14px;background:#FCFBF8;border:1px solid var(--line);border-radius:8px;}
.media-chip{
  display:flex;align-items:center;gap:7px;font-size:13.5px;padding:7px 12px;border:1px solid var(--line);
  border-radius:20px;background:#fff;cursor:pointer;user-select:none;transition:.12s;
}
.media-chip:hover{border-color:var(--accent);}
.media-chip input{accent-color:var(--accent);width:15px;height:15px;cursor:pointer;}
.media-chip:has(input:checked){background:var(--accent-soft);border-color:var(--accent);font-weight:600;color:var(--accent-dark);}
.filter-row{display:flex;gap:12px;align-items:flex-end;margin-bottom:18px;flex-wrap:wrap;}
.media-tag{display:inline-block;background:#EFEBE0;border-radius:4px;padding:2px 7px;font-size:12px;margin:1px 3px 1px 0;color:var(--ink);}
.section-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);font-weight:600;margin:0 0 12px;}

@media (max-width:800px){
  #app{grid-template-columns:1fr;}
  .sidebar{flex-direction:row;overflow-x:auto;align-items:center;}
  .nameplate,.rule-double,.sidebar-footer{display:none;}
  nav{flex-direction:row;}
  main{padding:22px;}
}
</style>
</head>
<body>
<div id="app"><div class="loading-screen">Memuat data…</div></div>

<script>
const STORAGE_KEY = 'rekap-berita-v1';
const MONTHS_ID = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

let data = { media: [], entries: [] };
let state = {
  tab: 'media',
  editingMediaId: null,
  editingEntryId: null,
  entryDate: todayISO(),
  inputMonthFilter: 'all',
  rekapMonth: 'all',
};

function todayISO(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function monthKey(iso){ return iso.slice(0,7); }
function monthLabel(key){
  const [y,m] = key.split('-');
  return MONTHS_ID[parseInt(m,10)-1] + ' ' + y;
}
function formatDateShort(iso){
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function mediaById(id){ return data.media.find(m => m.id === id); }

async function loadData(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      data.media = parsed.media || [];
      data.entries = parsed.entries || [];
    }
  }catch(e){
    // belum ada data tersimpan — mulai kosong
  }
}
async function persist(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(data), false);
    setStatus('Tersimpan otomatis');
  }catch(e){
    setStatus('Gagal menyimpan — coba lagi');
  }
}
function setStatus(msg){
  const el = document.getElementById('storage-status');
  if(el) el.textContent = msg;
}

/* ---------- MEDIA ---------- */
function addMedia(nama, wartawan){
  nama = nama.trim(); wartawan = wartawan.trim();
  if(!nama || !wartawan) return;
  data.media.push({ id: uid(), nama, wartawan });
  persist(); render();
}
function startEditMedia(id){ state.editingMediaId = id; render(); }
function cancelEditMedia(){ state.editingMediaId = null; render(); }
function saveEditMedia(id, nama, wartawan){
  nama = nama.trim(); wartawan = wartawan.trim();
  if(!nama || !wartawan) return;
  const m = mediaById(id);
  m.nama = nama; m.wartawan = wartawan;
  state.editingMediaId = null;
  persist(); render();
}
function deleteMedia(id){
  const count = data.entries.filter(e => e.mediaId === id).length;
  const msg = count > 0
    ? `Media ini memiliki ${count} berita tercatat. Hapus media beserta seluruh beritanya?`
    : 'Hapus media ini?';
  if(!confirm(msg)) return;
  data.media = data.media.filter(m => m.id !== id);
  data.entries = data.entries.filter(e => e.mediaId !== id);
  persist(); render();
}

/* ---------- ENTRIES ---------- */
function addEntries(tanggal, mediaIds, judul){
  judul = judul.trim();
  if(!tanggal || !mediaIds.length || !judul) return;
  mediaIds.forEach(mediaId => {
    data.entries.push({ id: uid(), tanggal, mediaId, judul });
  });
  state.entryDate = tanggal;
  persist(); render();
}
function startEditEntry(id){ state.editingEntryId = id; render(); }
function cancelEditEntry(){ state.editingEntryId = null; render(); }
function saveEditEntry(id, tanggal, mediaId, judul){
  judul = judul.trim();
  if(!tanggal || !mediaId || !judul) return;
  const e = data.entries.find(e => e.id === id);
  e.tanggal = tanggal; e.mediaId = mediaId; e.judul = judul;
  state.editingEntryId = null;
  persist(); render();
}
function deleteEntry(id){
  if(!confirm('Hapus berita ini?')) return;
  data.entries = data.entries.filter(e => e.id !== id);
  persist(); render();
}

/* ---------- RESET ---------- */
async function resetAll(){
  if(!confirm('Ini akan menghapus SEMUA data media dan berita yang tersimpan. Lanjutkan?')) return;
  if(!confirm('Konfirmasi sekali lagi: data tidak bisa dikembalikan. Hapus semua?')) return;
  data = { media: [], entries: [] };
  await persist(); render();
}

/* ---------- EXPORT ---------- */
function exportExcel(){
  const sorted = [...data.entries].sort((a,b) => a.tanggal.localeCompare(b.tanggal) || a.id.localeCompare(b.id));
  const sheet1 = [['No','Tanggal','Media','Wartawan','Judul Berita']];
  sorted.forEach((e,i) => {
    const m = mediaById(e.mediaId);
    sheet1.push([i+1, formatDateShort(e.tanggal), m ? m.nama : '(media dihapus)', m ? m.wartawan : '-', e.judul]);
  });

  const totals = {};
  data.entries.forEach(e => { totals[e.mediaId] = (totals[e.mediaId]||0) + 1; });
  const rank = data.media
    .map(m => ({ nama: m.nama, wartawan: m.wartawan, total: totals[m.id] || 0 }))
    .sort((a,b) => b.total - a.total);
  const sheet2 = [['Peringkat','Media','Wartawan','Total Berita']];
  rank.forEach((r,i) => sheet2.push([i+1, r.nama, r.wartawan, r.total]));

  const months = [...new Set(data.entries.map(e => monthKey(e.tanggal)))].sort();
  const sheet3 = [['Media','Wartawan', ...months.map(monthLabel), 'Total']];
  data.media.forEach(m => {
    const row = [m.nama, m.wartawan];
    let total = 0;
    months.forEach(mo => {
      const c = data.entries.filter(e => e.mediaId === m.id && monthKey(e.tanggal) === mo).length;
      row.push(c); total += c;
    });
    row.push(total);
    sheet3.push(row);
  });

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(sheet1), 'Data Berita');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(sheet2), 'Peringkat');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(sheet3), 'Rekap Bulanan');
  XLSX.writeFile(wb, 'Rekap_Berita_Pemkab_Aceh_Barat.xlsx');
}

/* ---------- RENDER ---------- */
function switchTab(tab){ state.tab = tab; render(); }

function render(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <aside class="sidebar">
      <div class="nameplate">
        <div class="kicker">Sistem Pemantauan</div>
        <h1>Rekap<br>Berita</h1>
        <div class="sub">Pemkab Aceh Barat</div>
      </div>
      <div class="rule-double"></div>
      <nav>
        <button data-tab="media" class="${state.tab==='media'?'active':''}">Media &amp; Wartawan</button>
        <button data-tab="input" class="${state.tab==='input'?'active':''}">Input Berita</button>
        <button data-tab="rekap" class="${state.tab==='rekap'?'active':''}">Rekap &amp; Peringkat</button>
      </nav>
      <div class="sidebar-footer">
        <div class="status" id="storage-status">Tersimpan otomatis</div>
        <button class="reset-btn" id="reset-btn">Hapus Semua Data</button>
      </div>
    </aside>
    <main id="main"></main>
  `;
  document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));
  document.getElementById('reset-btn').addEventListener('click', resetAll);
  renderMain();
}

function renderMain(){
  const main = document.getElementById('main');
  if(state.tab === 'media') return renderMediaTab(main);
  if(state.tab === 'input') return renderInputTab(main);
  if(state.tab === 'rekap') return renderRekapTab(main);
}

function renderMediaTab(main){
  const rows = data.media.map(m => {
    const jumlah = data.entries.filter(e => e.mediaId === m.id).length;
    if(state.editingMediaId === m.id){
      return `<tr>
        <td><input class="edit-input" id="edit-nama-${m.id}" value="${escapeHtml(m.nama)}"></td>
        <td><input class="edit-input" id="edit-wartawan-${m.id}" value="${escapeHtml(m.wartawan)}"></td>
        <td class="mono">${jumlah}</td>
        <td class="actions-cell">
          <button class="btn-small btn-save" data-save-media="${m.id}">Simpan</button>
          <button class="btn-small btn-cancel" data-cancel-media="${m.id}">Batal</button>
        </td>
      </tr>`;
    }
    return `<tr>
      <td>${escapeHtml(m.nama)}</td>
      <td>${escapeHtml(m.wartawan)}</td>
      <td class="mono">${jumlah}</td>
      <td class="actions-cell">
        <button class="btn-small btn-edit" data-edit-media="${m.id}">Ubah</button>
        <button class="btn-small btn-del" data-del-media="${m.id}">Hapus</button>
      </td>
    </tr>`;
  }).join('');

  main.innerHTML = `
    <div class="topbar">
      <div class="masthead">
        <div class="kicker">Data Utama</div>
        <h2>Media &amp; Wartawan</h2>
      </div>
    </div>
    <div class="masthead-rule"></div>

    <div class="card">
      <h3>Tambah Media</h3>
      <form class="inline-form" id="form-add-media">
        <div class="field grow"><label>Nama Media</label><input type="text" id="input-nama-media" placeholder="mis. Serambi Aceh" required></div>
        <div class="field grow"><label>Nama Wartawan</label><input type="text" id="input-wartawan" placeholder="mis. Budi Santoso" required></div>
        <button type="submit" class="btn-primary">Tambah Media</button>
      </form>
    </div>

    <div class="card">
      <h3>Daftar Media (${data.media.length})</h3>
      ${data.media.length === 0
        ? `<p class="muted">Belum ada media yang ditambahkan.</p>`
        : `<table>
            <thead><tr><th>Nama Media</th><th>Wartawan</th><th>Total Berita</th><th>Aksi</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>`}
    </div>
  `;

  document.getElementById('form-add-media').addEventListener('submit', ev => {
    ev.preventDefault();
    addMedia(document.getElementById('input-nama-media').value, document.getElementById('input-wartawan').value);
  });
  main.querySelectorAll('[data-edit-media]').forEach(b => b.addEventListener('click', () => startEditMedia(b.dataset.editMedia)));
  main.querySelectorAll('[data-del-media]').forEach(b => b.addEventListener('click', () => deleteMedia(b.dataset.delMedia)));
  main.querySelectorAll('[data-cancel-media]').forEach(b => b.addEventListener('click', cancelEditMedia));
  main.querySelectorAll('[data-save-media]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.saveMedia;
    saveEditMedia(id, document.getElementById(`edit-nama-${id}`).value, document.getElementById(`edit-wartawan-${id}`).value);
  }));
}

function renderInputTab(main){
  if(data.media.length === 0){
    main.innerHTML = `
      <div class="topbar"><div class="masthead"><div class="kicker">Catatan Harian</div><h2>Input Berita</h2></div></div>
      <div class="masthead-rule"></div>
      <div class="empty-note">
        Belum ada media terdaftar. Tambahkan media dan wartawan terlebih dahulu sebelum mencatat berita.
        <br><button id="go-media">Ke Tab Media &amp; Wartawan</button>
      </div>`;
    document.getElementById('go-media').addEventListener('click', () => switchTab('media'));
    return;
  }

  const months = [...new Set(data.entries.map(e => monthKey(e.tanggal)))].sort().reverse();
  const filtered = data.entries
    .filter(e => state.inputMonthFilter === 'all' || monthKey(e.tanggal) === state.inputMonthFilter)
    .sort((a,b) => b.tanggal.localeCompare(a.tanggal) || b.id.localeCompare(a.id));

  const mediaChecklist = data.media.map(m =>
    `<label class="media-chip"><input type="checkbox" class="media-checkbox" value="${m.id}"> ${escapeHtml(m.nama)}</label>`
  ).join('');

  const rows = filtered.map(e => {
    const m = mediaById(e.mediaId);
    if(state.editingEntryId === e.id){
      const opts = data.media.map(mm => `<option value="${mm.id}" ${mm.id===e.mediaId?'selected':''}>${escapeHtml(mm.nama)}</option>`).join('');
      return `<tr>
        <td><input type="date" class="edit-input" id="edit-tgl-${e.id}" value="${e.tanggal}"></td>
        <td><select class="edit-input" id="edit-media-${e.id}">${opts}</select></td>
        <td><input class="edit-input" id="edit-judul-${e.id}" value="${escapeHtml(e.judul)}"></td>
        <td class="actions-cell">
          <button class="btn-small btn-save" data-save-entry="${e.id}">Simpan</button>
          <button class="btn-small btn-cancel" data-cancel-entry="${e.id}">Batal</button>
        </td>
      </tr>`;
    }
    return `<tr>
      <td class="mono">${formatDateShort(e.tanggal)}</td>
      <td>${m ? escapeHtml(m.nama) : '<span class="muted">(media dihapus)</span>'}<br><span class="muted">${m ? escapeHtml(m.wartawan) : ''}</span></td>
      <td>${escapeHtml(e.judul)}</td>
      <td class="actions-cell">
        <button class="btn-small btn-edit" data-edit-entry="${e.id}">Ubah</button>
        <button class="btn-small btn-del" data-del-entry="${e.id}">Hapus</button>
      </td>
    </tr>`;
  }).join('');

  main.innerHTML = `
    <div class="topbar"><div class="masthead"><div class="kicker">Catatan Harian</div><h2>Input Berita</h2></div></div>
    <div class="masthead-rule"></div>

    <div class="card">
      <h3>Tambah Berita</h3>
      <form id="form-add-entry">
        <div class="inline-form" style="margin-bottom:16px;">
          <div class="field"><label>Tanggal</label><input type="date" id="input-tanggal" value="${state.entryDate}" required></div>
          <div class="field grow"><label>Judul Berita</label><input type="text" id="input-judul" placeholder="Judul berita yang diupload" required></div>
        </div>
        <div class="field" style="margin-bottom:10px;">
          <label>Media yang Upload (bisa pilih lebih dari satu)</label>
        </div>
        <div class="checklist-toolbar">
          <button type="button" class="btn-small btn-edit" id="btn-pilih-semua">Pilih Semua</button>
          <button type="button" class="btn-small btn-cancel" id="btn-kosongkan">Kosongkan</button>
        </div>
        <div class="media-checklist">${mediaChecklist}</div>
        <button type="submit" class="btn-primary" style="margin-top:16px;">Simpan Berita</button>
      </form>
      <p class="muted" style="margin-top:10px;">Satu judul berita bisa langsung dicatat untuk beberapa media sekaligus — tanggal akan otomatis diingat untuk input berikutnya.</p>
    </div>

    <div class="card">
      <div class="filter-row">
        <h3 style="margin:0;flex:1;">Daftar Berita (${filtered.length})</h3>
        <div class="field">
          <label>Filter Bulan</label>
          <select id="filter-bulan">
            <option value="all" ${state.inputMonthFilter==='all'?'selected':''}>Semua Waktu</option>
            ${months.map(mo => `<option value="${mo}" ${state.inputMonthFilter===mo?'selected':''}>${monthLabel(mo)}</option>`).join('')}
          </select>
        </div>
      </div>
      ${filtered.length === 0
        ? `<p class="muted">Belum ada berita tercatat untuk periode ini.</p>`
        : `<table>
            <thead><tr><th>Tanggal</th><th>Media / Wartawan</th><th>Judul Berita</th><th>Aksi</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>`}
    </div>
  `;

  document.getElementById('form-add-entry').addEventListener('submit', ev => {
    ev.preventDefault();
    const checked = [...main.querySelectorAll('.media-checkbox:checked')].map(cb => cb.value);
    if(checked.length === 0){ alert('Pilih minimal satu media.'); return; }
    addEntries(document.getElementById('input-tanggal').value, checked, document.getElementById('input-judul').value);
  });
  document.getElementById('filter-bulan').addEventListener('change', ev => { state.inputMonthFilter = ev.target.value; render(); });
  document.getElementById('btn-pilih-semua').addEventListener('click', () => {
    main.querySelectorAll('.media-checkbox').forEach(cb => cb.checked = true);
  });
  document.getElementById('btn-kosongkan').addEventListener('click', () => {
    main.querySelectorAll('.media-checkbox').forEach(cb => cb.checked = false);
  });
  main.querySelectorAll('[data-edit-entry]').forEach(b => b.addEventListener('click', () => startEditEntry(b.dataset.editEntry)));
  main.querySelectorAll('[data-del-entry]').forEach(b => b.addEventListener('click', () => deleteEntry(b.dataset.delEntry)));
  main.querySelectorAll('[data-cancel-entry]').forEach(b => b.addEventListener('click', cancelEditEntry));
  main.querySelectorAll('[data-save-entry]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.saveEntry;
    saveEditEntry(id, document.getElementById(`edit-tgl-${id}`).value, document.getElementById(`edit-media-${id}`).value, document.getElementById(`edit-judul-${id}`).value);
  }));
}

function renderRekapTab(main){
  const months = [...new Set(data.entries.map(e => monthKey(e.tanggal)))].sort().reverse();
  const filteredEntries = data.entries.filter(e => state.rekapMonth === 'all' || monthKey(e.tanggal) === state.rekapMonth);

  const totals = {};
  filteredEntries.forEach(e => { totals[e.mediaId] = (totals[e.mediaId]||0) + 1; });
  const rank = data.media
    .map(m => ({ id: m.id, nama: m.nama, wartawan: m.wartawan, jumlah: totals[m.id] || 0 }))
    .sort((a,b) => b.jumlah - a.jumlah);

  const rankRows = rank.map((r,i) => {
    const pos = i + 1;
    const badgeClass = pos <= 3 ? `rank-${pos}` : '';
    return `<tr class="${pos<=3?'row-top':''}">
      <td><span class="rank-badge ${badgeClass}">${pos}</span></td>
      <td class="media-cell">${escapeHtml(r.nama)}</td>
      <td class="muted">${escapeHtml(r.wartawan)}</td>
      <td class="mono">${r.jumlah}</td>
    </tr>`;
  }).join('');

  const dateGroups = {};
  filteredEntries.forEach(e => { (dateGroups[e.tanggal] = dateGroups[e.tanggal] || []).push(e); });
  const sortedDates = Object.keys(dateGroups).sort().reverse();
  const dailyRows = sortedDates.map(tgl => {
    const list = dateGroups[tgl];
    const counts = {};
    list.forEach(e => { const m = mediaById(e.mediaId); const label = m ? m.nama : '(dihapus)'; counts[label] = (counts[label]||0)+1; });
    const tags = Object.entries(counts).map(([nama,c]) => `<span class="media-tag">${escapeHtml(nama)}${c>1?` (${c}x)`:''}</span>`).join('');
    return `<tr>
      <td class="mono">${formatDateShort(tgl)}</td>
      <td class="mono">${list.length}</td>
      <td>${tags}</td>
    </tr>`;
  }).join('');

  main.innerHTML = `
    <div class="topbar">
      <div class="masthead"><div class="kicker">Laporan</div><h2>Rekap &amp; Peringkat</h2></div>
      <button class="export-btn" id="btn-export">Export ke Excel</button>
    </div>
    <div class="masthead-rule"></div>

    <div class="card">
      <div class="filter-row">
        <div class="field">
          <label>Periode</label>
          <select id="filter-rekap-bulan">
            <option value="all" ${state.rekapMonth==='all'?'selected':''}>Total Semua Waktu</option>
            ${months.map(mo => `<option value="${mo}" ${state.rekapMonth===mo?'selected':''}>${monthLabel(mo)}</option>`).join('')}
          </select>
        </div>
      </div>
      <p class="section-label">Peringkat Media Berdasarkan Jumlah Berita</p>
      ${data.media.length === 0
        ? `<p class="muted">Belum ada media terdaftar.</p>`
        : `<table>
            <thead><tr><th>#</th><th>Media</th><th>Wartawan</th><th>Jumlah Berita</th></tr></thead>
            <tbody>${rankRows}</tbody>
          </table>`}
    </div>

    <div class="card">
      <h3>Rincian Harian</h3>
      ${sortedDates.length === 0
        ? `<p class="muted">Tidak ada berita pada periode ini.</p>`
        : `<table>
            <thead><tr><th>Tanggal</th><th>Jumlah</th><th>Media yang Upload</th></tr></thead>
            <tbody>${dailyRows}</tbody>
          </table>`}
    </div>
  `;

  document.getElementById('filter-rekap-bulan').addEventListener('change', ev => { state.rekapMonth = ev.target.value; render(); });
  document.getElementById('btn-export').addEventListener('click', exportExcel);
}

/* ---------- INIT ---------- */
(async function init(){
  await loadData();
  render();
})();
</script>
</body>
</html>
